name: Auto Version Bump

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'src/config/version.ts'
      - '.github/workflows/version-bump.yml'

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Get current version
        id: get_version
        run: |
          CURRENT_VERSION=$(grep -oP "APP_VERSION = '\K[^']+" src/config/version.ts)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Determine version bump type
        id: bump_type
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          # Check commit message for version bump keywords
          if echo "$COMMIT_MSG" | grep -qiE "^(breaking|major):"; then
            echo "bump=major" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -qiE "^(feat|feature|minor):"; then
            echo "bump=minor" >> $GITHUB_OUTPUT
          else
            echo "bump=patch" >> $GITHUB_OUTPUT
          fi

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.get_version.outputs.current_version }}"
          BUMP="${{ steps.bump_type.outputs.bump }}"
          
          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          
          # Increment based on bump type
          case $BUMP in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update version file
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          BUILD_DATE=$(date +%Y-%m-%d)
          
          cat > src/config/version.ts << EOF
          // Application version - This file is auto-updated by GitHub Actions
          // Do not manually edit the version constant

          export const APP_VERSION = '$NEW_VERSION'
          export const BUILD_DATE = '$BUILD_DATE'

          // Version display format
          export const getVersionDisplay = () => \`v\${APP_VERSION}\`
          export const getFullVersionInfo = () => \`v\${APP_VERSION} (\${BUILD_DATE})\`
          EOF

      - name: Update package.json version
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          npm version $NEW_VERSION --no-git-tag-version --allow-same-version

      - name: Commit and push changes
        run: |
          git add src/config/version.ts package.json package-lock.json || true
          git commit -m "chore: bump version to ${{ steps.new_version.outputs.new_version }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD
